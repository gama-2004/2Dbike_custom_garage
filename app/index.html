<title>2Dカスタムガレージ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 左にサイドビューの作業台（スティッキー）とビルドシート、右にパーツ棚。スマホでは作業台を上に固定し、棚→シートの順に積む */
:root{
  --bg:#e7eaee; --panel:#f8f9fa; --ink:#16181c; --muted:#5b626d; --line:#cdd3da;
  --accent:#1e4fd0; --accent-ink:#ffffff; --stage:#dde2e8; --grid:rgba(30,79,208,.09);
  --shadow:rgba(10,14,22,.22); --flash:rgba(30,79,208,.14);
  --f-display:"Dela Gothic One","Hiragino Kaku Gothic StdN","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101217; --panel:#191c22; --ink:#e7e9ed; --muted:#9aa1ac; --line:#2b3039;
  --accent:#7f9dff; --accent-ink:#0d1020; --stage:#242831; --grid:rgba(127,157,255,.08);
  --shadow:rgba(0,0,0,.5); --flash:rgba(127,157,255,.16); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101217; --panel:#191c22; --ink:#e7e9ed; --muted:#9aa1ac; --line:#2b3039;
  --accent:#7f9dff; --accent-ink:#0d1020; --stage:#242831; --grid:rgba(127,157,255,.08);
  --shadow:rgba(0,0,0,.5); --flash:rgba(127,157,255,.16); color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(22px,3.4vw,32px);line-height:1.1;margin:0;letter-spacing:.02em;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;font-size:13px}
.hdr-actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{border:1px solid var(--line);background:var(--panel);padding:7px 14px;border-radius:6px;font-size:13px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.main{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:22px;align-items:start}
.left{position:sticky;top:max(12px,env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:16px}

.stage{position:relative;background-color:var(--stage);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;border-radius:10px;border:1px solid var(--line);overflow:hidden}
.stage svg{display:block;width:100%;height:auto}
.stage svg [data-part]{cursor:pointer}
.style-tag{position:absolute;left:14px;top:12px;display:flex;flex-direction:column;pointer-events:none}
.style-tag small{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.style-tag b{font-family:var(--f-display);font-weight:400;font-size:clamp(16px,2.4vw,24px);line-height:1.2}
.hint{position:absolute;right:12px;top:12px;font-size:11px;color:var(--muted);pointer-events:none}

.sheet{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.sheet h2{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.sheet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:0 22px}
.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.row span:first-child{color:var(--muted);white-space:nowrap}
.row span:last-child{font-weight:500;text-align:right;display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;border:1px solid rgba(127,127,127,.5);display:inline-block;flex:none}
.specs{display:flex;gap:22px;flex-wrap:wrap;margin-top:14px;align-items:flex-end}
.spec{display:flex;flex-direction:column}
.spec small{font-size:11px;color:var(--muted)}
.spec b{font-family:var(--f-mono);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.spec-note{font-size:11px;color:var(--muted)}

.shelf{display:flex;flex-direction:column;gap:12px}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;transition:background-color .4s}
.sec.flash{background:var(--flash)}
.sec h3{margin:0 0 8px;font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec h3 em{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip:disabled{opacity:.4;cursor:not-allowed}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--panel) inset}
.custom{position:relative;width:30px;height:30px;border-radius:50%;border:2px dashed var(--line);overflow:hidden;display:inline-flex}
.custom input{position:absolute;inset:-6px;width:42px;height:42px;opacity:0;cursor:pointer}
.custom span{margin:auto;font-size:15px;color:var(--muted);pointer-events:none}
.label-sm{font-size:12px;color:var(--muted);margin:12px 0 6px}
.label-sm:first-of-type{margin-top:0}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}
.inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.num{width:72px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:transparent;font-family:var(--f-mono);font-size:14px}
.range{display:flex;align-items:center;gap:12px}
.range input{flex:1;accent-color:var(--accent)}
.range output{font-family:var(--f-mono);font-variant-numeric:tabular-nums;min-width:62px;text-align:right}

.saves{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.save{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.save button.load{flex:1;text-align:left;background:none;border:0;padding:2px;display:flex;align-items:center;gap:8px;min-width:0}
.save .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.save .st{font-size:11px;color:var(--muted);white-space:nowrap}
.save .del{background:none;border:0;color:var(--muted);font-size:16px;padding:0 6px}
.empty{font-size:12px;color:var(--muted);margin:8px 0 0}

@media (max-width:900px){
  .main{grid-template-columns:minmax(0,1fr)}
  .left{display:contents}
  .stage{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:0 6px 16px -10px var(--shadow)}
  .shelf{order:2}.sheet{order:3}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){.sec{transition:none}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>2Dカスタムガレージ</h1>
      <p class="sub">ベース車両を選んで、外装・足まわり・塗装を組み替えられます。車体のパーツをクリックすると、その棚に移動します。</p>
    </div>
    <div class="hdr-actions">
      <button class="btn" id="btn-random" type="button">おまかせ組み</button>
      <button class="btn" id="btn-reset" type="button">ノーマルに戻す</button>
    </div>
  </header>

  <div class="main">
    <div class="left">
      <div class="stage">
        <div class="style-tag"><small>Style</small><b id="style-name">スーパースポーツ</b></div>
        <div class="hint">パーツをクリックで編集</div>
        <svg id="bike" viewBox="0 0 800 440" role="img" aria-label="カスタムしたスーパースポーツのサイドビュー"></svg>
      </div>
      <section class="sheet" aria-label="ビルドシート">
        <h2>Build sheet</h2>
        <div class="sheet-grid" id="sheet"></div>
        <div class="specs" id="specs"></div>
      </section>
    </div>
    <div class="shelf" id="shelf"></div>
  </div>
</div>

<script>
/* ================= shared drawing helpers ================= */
const CHROME='#b4bbc3',CHROME_HI='#eef1f4',TIRE='#151515',DARK='#2b2d31';
const r1=n=>Math.round(n*10)/10, rad=d=>d*Math.PI/180;
const pol=(c,r,a)=>({x:c.x+r*Math.cos(rad(a)),y:c.y+r*Math.sin(rad(a))});
const lerp=(a,b,t)=>({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t});
const pt=p=>`${r1(p.x)} ${r1(p.y)}`;
function arc(c,r,a1,a2){return `M${pt(pol(c,r,a1))} A${r} ${r} 0 ${Math.abs(a2-a1)>180?1:0} ${a2>a1?1:0} ${pt(pol(c,r,a2))}`}
function band(c,ro,ri,a1,a2){const L=Math.abs(a2-a1)>180?1:0,sw=a2>a1?1:0;
 return `M${pt(pol(c,ro,a1))} A${ro} ${ro} 0 ${L} ${sw} ${pt(pol(c,ro,a2))} L${pt(pol(c,ri,a2))} A${ri} ${ri} 0 ${L} ${1-sw} ${pt(pol(c,ri,a1))} Z`}
const line=(x1,y1,x2,y2,c,w,extra='')=>`<line x1="${r1(x1)}" y1="${r1(y1)}" x2="${r1(x2)}" y2="${r1(y2)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${extra}/>`;
const pipe=(d,w)=>`<path d="${d}" fill="none" stroke="${CHROME}" stroke-width="${w}" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${CHROME_HI}" stroke-width="${Math.max(1.5,w*.25)}" stroke-linecap="round" transform="translate(0 -${r1(w*.2)})"/>`;
const poly=(pts,fill)=>`<polygon points="${pts.map(p=>`${r1(p.x)},${r1(p.y)}`).join(' ')}" fill="${fill}"/>`;
function ground(RA,FA,wb){
 return `<ellipse cx="${(RA.x+FA.x)/2}" cy="400" rx="${(FA.x-RA.x)/2+110}" ry="7" style="fill:var(--shadow)"/>`+
 `<g style="stroke:var(--muted)" stroke-width="1"><line x1="${RA.x}" y1="424" x2="${FA.x}" y2="424"/><line x1="${RA.x}" y1="416" x2="${RA.x}" y2="432"/><line x1="${FA.x}" y1="416" x2="${FA.x}" y2="432"/></g>`+
 `<text x="${(RA.x+FA.x)/2}" y="418" text-anchor="middle" style="fill:var(--muted);font:500 11px var(--f-mono)">WHEELBASE ${wb} mm</text>`;
}
function swingarm(piv,RA,color,wA,wB){const ang=Math.atan2(RA.y-piv.y,RA.x-piv.x)*180/Math.PI;
 return `<g data-part="frame">${poly([pol(piv,wA,ang-90),pol(RA,wB,ang-90),pol(RA,wB,ang+90),pol(piv,wA,ang+90)],color)}<circle cx="${piv.x}" cy="${piv.y}" r="7" fill="#7d838b"/><circle cx="${RA.x}" cy="${RA.y}" r="9" fill="#5b6067"/></g>`}

let S; // current base's state (set at boot)

/* ================= SUPERSPORT ================= */
const SS_PAINT=[['#c4161c','キャンディレッド'],['#e9ecef','パールホワイト'],['#25262a','マットブラック'],['#4d5560','ガンメタ'],['#1d2f6b','ミッドナイトブルー'],['#0f6e6c','ディープティール'],['#e2611b','ブレイズオレンジ'],['#b8bec6','シルバー']];
const SS={
 label:'スーパースポーツ',wheelbase:'1,370',lowerMax:20,
 aria:'カスタムしたスーパースポーツのサイドビュー',
 PARTS:{
  cowl:['カウル',[['full','フルカウル'],['half','ハーフカウル'],['naked','ネイキッド化']]],
  screen:['スクリーン',[['low','ロー'],['std','スタンダード'],['tall','ロング']]],
  light:['ヘッドライト',[['slit','シャープ2眼'],['round','丸目LED'],['square','角目LED']]],
  livery:['グラフィック',[['solid','ソリッド'],['twotone','2トーン'],['stripe','ストライプ'],['racing','レーシング']]],
  bar:['ハンドル',[['clip','セパハン'],['bar','バーハンドル']]],
  mirror:['ミラー',[['stock','ノーマル'],['barend','バーエンド'],['none','なし（サーキット）']]],
  exhaust:['マフラー',[['stock','ノーマル'],['slipon','スリップオン（チタン）'],['short','ショートサイレンサー'],['centerup','センターアップ']]],
  tail:['テール',[['stock','ノーマル'],['fenderless','フェンダーレス']]],
  seat:['シート',[['tandem','タンデム'],['single','シングルシートカウル']]],
  wheel:['ホイール',[['y5','5本Yスポーク'],['ten','10本スポーク'],['forged','鍛造7本']]],
 },
 SW:{
  main:SS_PAINT, sub:SS_PAINT,
  accent:[['#f2f2f2','ホワイト'],['#111111','ブラック'],['#c79a2b','ゴールド'],['#e2611b','オレンジ'],['#c4161c','レッド'],['#33c3d6','シアン']],
  frameColor:[['#1c1c1e','ブラック'],['#b8bec6','アルミシルバー'],['#4d5560','ガンメタ'],['#a3121c','レッド']],
  seatColor:[['#1b1b1d','ブラック'],['#55585e','グレー'],['#5a3420','ブラウン']],
  rimColor:[['#1c1c1e','ブラック'],['#c9ced4','シルバー'],['#c79a2b','ゴールド'],['#8a5a2b','ブロンズ'],['#c4161c','レッド']],
  forkColor:[['#c9a227','ゴールド'],['#8c8fa6','チタン'],['#2b2d31','ブラック'],['#c9ced4','シルバー']],
  caliperColor:[['#c9a227','ゴールド'],['#c4161c','レッド'],['#2b2d31','ブラック'],['#2a62c9','ブルー']],
 },
 COLOR_LABEL:{main:'メインカラー',sub:'サブカラー',accent:'ライン',frameColor:'フレーム',seatColor:'シート表皮',rimColor:'リム',forkColor:'フロントフォーク',caliperColor:'キャリパー'},
 BOOL:new Set(['rimStripe','zekken']),
 DEFAULT:{cowl:'full',screen:'std',light:'slit',livery:'twotone',bar:'clip',mirror:'stock',exhaust:'stock',tail:'stock',seat:'tandem',wheel:'y5',
  main:'#c4161c',sub:'#25262a',accent:'#f2f2f2',frameColor:'#1c1c1e',seatColor:'#1b1b1d',rimColor:'#1c1c1e',forkColor:'#c9a227',caliperColor:'#c9a227',
  rimStripe:false,zekken:false,number:27,lower:0},
 PRESETS:[
  ['ノーマル',{}],
  ['サーキット仕様',{cowl:'full',screen:'low',light:'slit',livery:'racing',bar:'clip',mirror:'none',exhaust:'short',tail:'fenderless',seat:'single',wheel:'forged',
   main:'#e9ecef',sub:'#e2611b',accent:'#111111',rimColor:'#1c1c1e',forkColor:'#c9a227',caliperColor:'#c9a227',rimStripe:true,zekken:true,number:27}],
  ['ストリートファイター',{cowl:'naked',light:'round',livery:'stripe',bar:'bar',mirror:'barend',exhaust:'slipon',tail:'fenderless',wheel:'ten',
   main:'#25262a',sub:'#4d5560',accent:'#e2611b',rimColor:'#8a5a2b',forkColor:'#2b2d31',caliperColor:'#c4161c',lower:8}],
  ['スポーツツアラー',{screen:'tall',livery:'twotone',bar:'bar',main:'#1d2f6b',sub:'#b8bec6',accent:'#f2f2f2',rimColor:'#c9ced4',forkColor:'#c9ced4',caliperColor:'#2b2d31'}],
  ['ナイトシャドウ',{livery:'solid',exhaust:'centerup',tail:'fenderless',seat:'single',main:'#25262a',sub:'#25262a',accent:'#4d5560',forkColor:'#2b2d31',caliperColor:'#2b2d31',rimColor:'#1c1c1e',lower:10}],
 ],
 styleName(s){
  if(s.cowl==='naked')return 'ストリートファイター';
  if(s.zekken&&s.mirror==='none')return 'サーキット仕様';
  if(s.screen==='tall'&&s.bar==='bar')return 'スポーツツアラー';
  if(s.cowl==='half')return 'ハーフカウル スポーツ';
  return 'スーパースポーツ';
 },
 weight(s){let w=166;
  w+={full:0,half:-2,naked:-5}[s.cowl];w+={stock:0,slipon:-3.2,short:-4,centerup:-1}[s.exhaust];
  w+=s.tail==='fenderless'?-1.2:0;w+=s.wheel==='forged'?-2.5:0;w+=s.mirror==='none'?-.8:0;w+=s.seat==='single'?.3:0;return w},
 sheet(s){
  const rows=['cowl','screen','light','bar','mirror','exhaust','tail','seat','wheel','livery'].map(k=>[this.PARTS[k][0],k==='screen'&&s.cowl==='naked'?'—':optLabel(k,s[k])]);
  const colors=['main','sub','accent','frameColor','rimColor','forkColor','caliperColor','seatColor'].map(k=>[this.COLOR_LABEL[k],colorName(k,s[k]),s[k]]);
  colors.push(['ゼッケン',s.zekken?`#${s.number}`:'なし',null]);
  const specs=[['シート高',`${795-s.lower*2} mm`],['最低地上高',`${148-s.lower*2} mm`],['車両重量',`${this.weight(s).toFixed(1)} kg`]];
  return {rows,colors,specs};
 },
 partMap:{wheel:'sec-wheel',caliper:'sec-fork',fork:'sec-fork',frame:'sec-frameColor',engine:'sec-cowl',exhaust:'sec-exhaust',seat:'sec-seat',paint:'sec-paint',light:'sec-light',bar:'sec-bar',mirror:'sec-mirror',tail:'sec-tail',screen:'sec-screen'},
 shelf(){
  let h=partSec('cowl')+partSec('screen',`<p class="note" id="screen-note" hidden>ネイキッド化するとスクリーンは外れます。</p>`)+partSec('light');
  h+=`<section class="sec" id="sec-paint"><h3>塗装 <em>PAINT</em></h3>
    <div class="label-sm">グラフィック</div>${chipRow('livery',this.PARTS.livery[1])}
    <div class="label-sm">メインカラー</div>${swatchRow('main')}
    <div class="label-sm">サブカラー</div>${swatchRow('sub')}
    <div class="label-sm">ライン</div>${swatchRow('accent')}
    <div class="label-sm">ゼッケン</div><div class="inline">${chipRow('zekken',[['on','あり'],['off','なし']])}<input class="num" type="number" id="zekken-num" min="0" max="99" aria-label="ゼッケン番号"></div></section>`;
  h+=partSec('bar')+partSec('mirror')+partSec('exhaust')+partSec('tail')+partSec('seat');
  h+=`<section class="sec" id="sec-wheel"><h3>ホイール</h3>${chipRow('wheel',this.PARTS.wheel[1])}<div class="label-sm">リム色</div>${swatchRow('rimColor')}
    <div class="label-sm">リムストライプ（ライン色）</div>${chipRow('rimStripe',[['on','あり'],['off','なし']])}</section>`;
  h+=`<section class="sec" id="sec-fork"><h3>足まわり</h3><div class="label-sm">フロントフォーク</div>${swatchRow('forkColor')}<div class="label-sm">ブレーキキャリパー</div>${swatchRow('caliperColor')}</section>`;
  h+=`<section class="sec" id="sec-frameColor"><h3>フレーム・スイングアーム</h3>${swatchRow('frameColor')}</section>`;
  h+=`<section class="sec" id="sec-seatColor"><h3>シート表皮</h3>${swatchRow('seatColor')}</section>`;
  return h;
 },
 uiExtra(s){
  document.querySelectorAll('#sec-screen .chip').forEach(b=>b.disabled=s.cowl==='naked');
  document.getElementById('screen-note').hidden=s.cowl!=='naked';
  const zn=document.getElementById('zekken-num');if(document.activeElement!==zn)zn.value=s.number;
 },
 randomExtra(s){s.rimStripe=Math.random()<.5;s.zekken=Math.random()<.3;s.number=Math.floor(Math.random()*99)+1},
 draw(){return drawSS()},
};

const SS_P={
 tank:'M384 196 C386 168 420 150 462 144 C488 140 506 144 510 152 L474 196 Z',
 tail:'M392 210 L302 196 L258 179 C240 172 222 161 204 148 L207 161 C222 183 258 207 304 223 L364 236 Z',
 single:'M306 198 L258 181 L255 172 C272 160 300 166 306 184 Z',
 upper:'M498 130 C545 124 592 158 614 192 L602 206 C580 214 560 224 548 240 L528 262 L440 262 L412 232 L388 208 L468 192 L494 152 Z',
 lower:'M528 262 L502 300 C490 330 465 344 420 342 L368 336 C352 326 354 305 370 295 L398 262 Z',
 shroud:'M466 196 L516 186 L530 246 L488 258 L458 232 Z',
 nakedFace:'M534 150 L572 156 L580 192 L546 196 Z',
};
const SS_SCREEN={
 low:'M520 132 C538 118 556 112 576 114 L592 156 C572 146 545 136 520 132 Z',
 std:'M512 130 C528 110 552 98 572 100 L592 156 C572 146 540 134 512 130 Z',
 tall:'M506 130 C516 92 544 68 566 68 L592 156 C570 146 538 134 506 130 Z',
};
function wheelSS(c,front){
 let g=`<g data-part="wheel">`;
 g+=`<circle cx="${c.x}" cy="${c.y}" r="70" fill="none" stroke="${TIRE}" stroke-width="17"/>`;
 g+=`<circle cx="${c.x}" cy="${c.y}" r="76" fill="none" stroke="#3a3a3a" stroke-width="1.2" stroke-dasharray="4 5"/>`;
 g+=`<circle cx="${c.x}" cy="${c.y}" r="57.5" fill="none" stroke="${S.rimColor}" stroke-width="5"/>`;
 if(S.rimStripe)g+=`<circle cx="${c.x}" cy="${c.y}" r="60.6" fill="none" stroke="${S.accent}" stroke-width="1.8"/>`;
 const rc=S.rimColor;
 if(S.wheel==='y5'){for(let i=0;i<5;i++){const a=i*72-90+(front?0:20);
   g+=poly([pol(c,12,a-26),pol(c,32,a-7),pol(c,32,a+7),pol(c,12,a+26)],rc);
   for(const s of[-1,1])g+=poly([pol(c,30,a+s*2),pol(c,30,a+s*9),pol(c,56,a+s*15),pol(c,56,a+s*8)],rc);}}
 else if(S.wheel==='ten'){for(let i=0;i<10;i++){const a=i*36-90;g+=poly([pol(c,12,a-10),pol(c,56,a-3.5),pol(c,56,a+3.5),pol(c,12,a+10)],rc)}}
 else{for(let i=0;i<7;i++){const a=i*(360/7)-90,p=pol(c,12,a),m=pol(c,36,a+14),q=pol(c,56,a+6);
   g+=`<path d="M${pt(p)} Q${pt(m)} ${pt(q)}" fill="none" stroke="${rc}" stroke-width="5.5" stroke-linecap="round"/>`}}
 if(front){g+=`<circle cx="${c.x}" cy="${c.y}" r="43" fill="none" stroke="#9aa0a8" stroke-width="9"/>`;
  for(let i=0;i<16;i++){const p=pol(c,43,i*22.5);g+=`<circle cx="${r1(p.x)}" cy="${r1(p.y)}" r="1.8" fill="#55585d"/>`}
  const k=pol(c,40,-148);g+=`<rect x="${r1(k.x-9)}" y="${r1(k.y-14)}" width="18" height="28" rx="5" fill="${S.caliperColor}" transform="rotate(-30 ${r1(k.x)} ${r1(k.y)})" data-part="caliper"/>`;}
 else{g+=`<circle cx="${c.x}" cy="${c.y}" r="27" fill="none" stroke="#9aa0a8" stroke-width="5"/>`;
  const k=pol(c,26,-70);g+=`<rect x="${r1(k.x-7)}" y="${r1(k.y-10)}" width="14" height="20" rx="4" fill="${S.caliperColor}" transform="rotate(20 ${r1(k.x)} ${r1(k.y)})" data-part="caliper"/>`;}
 g+=`<circle cx="${c.x}" cy="${c.y}" r="12" fill="#7d838b"/><circle cx="${c.x}" cy="${c.y}" r="4.5" fill="#2d2f33"/></g>`;
 return g;
}

 const tr=front?68:60, tw=front?15:24, rr=front?57:46;

/* ================= state & UI ================= */
const BASES={ss:SS,us:US};
const KEY_CUR='ss-garage-current',KEY_SAVES='ss-garage-builds';
function load(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let cur=(()=>{const v=load(KEY_CUR);
 if(v&&v.base)return {base:BASES[v.base]?v.base:'ss',ss:{...SS.DEFAULT,...(v.ss||{})},us:{...US.DEFAULT,...(v.us||{})}};
 return {base:'ss',ss:{...SS.DEFAULT,...(v||{})},us:{...US.DEFAULT}};})();
let BASE=BASES[cur.base]; S=cur[cur.base];
function setState(next){cur[cur.base]=next;S=next}

const optLabel=(k,v)=>(BASE.PARTS[k][1].find(o=>o[0]===v)||[,v])[1];
const colorName=(k,v)=>((BASE.SW[k]||[]).find(c=>c[0]===v)||[,'カスタム'])[1];
const chipRow=(key,opts)=>`<div class="chips" role="group">`+opts.map(([v,l])=>`<button type="button" class="chip" id="opt-${key}-${v}" data-k="${key}" data-v="${v}">${l}</button>`).join('')+`</div>`;
const swatchRow=key=>`<div class="swatches">`+BASE.SW[key].map(([c,n])=>`<button type="button" class="sw" id="sw-${key}-${c.slice(1)}" data-k="${key}" data-v="${c}" title="${n}" aria-label="${n}" style="background:${c}"></button>`).join('')+
 `<label class="custom" title="好きな色を選ぶ"><input type="color" id="pick-${key}" data-k="${key}" aria-label="${BASE.COLOR_LABEL[key]}のカスタム色"><span>＋</span></label></div>`;
const partSec=(k,extra='')=>`<section class="sec" id="sec-${k}"><h3>${BASE.PARTS[k][0]}</h3>${chipRow(k,BASE.PARTS[k][1])}${extra}</section>`;

function buildShelf(){
 const shelf=document.getElementById('shelf');
 let h=`<section class="sec"><h3>ベース車両</h3><div class="chips">${Object.entries(BASES).map(([k,b])=>`<button type="button" class="chip" id="base-${k}" data-base="${k}" aria-pressed="${k===cur.base}">${b.label}</button>`).join('')}</div>
   <div class="label-sm">ベース仕様</div><div class="chips">${BASE.PRESETS.map(([n],i)=>`<button type="button" class="chip" id="preset-${cur.base}-${i}" data-preset="${i}">${n}</button>`).join('')}</div></section>`;
 h+=BASE.shelf();
 h+=`<section class="sec" id="sec-lower"><h3>ローダウン <em>車高</em></h3><div class="range"><input type="range" id="lower" min="0" max="${BASE.lowerMax}" step="1" aria-label="ローダウン量"><output id="lower-out"></output></div></section>`;
 h+=`<section class="sec" id="sec-saves"><h3>マイガレージ <em>このブラウザに保存</em></h3><button type="button" class="btn primary" id="btn-save">今の仕様を保存</button><div class="saves" id="saves"></div></section>`;
 shelf.innerHTML=h;
 document.getElementById('btn-save').onclick=saveBuild;
 document.getElementById('bike').setAttribute('aria-label',BASE.aria);
}
const shelfEl=document.getElementById('shelf');
shelfEl.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.base){if(b.dataset.base!==cur.base)switchBase(b.dataset.base);return}
 if(b.dataset.preset!=null){setState({...BASE.DEFAULT,...BASE.PRESETS[b.dataset.preset][1]});return render()}
 if(b.dataset.k){const k=b.dataset.k,v=b.dataset.v;S[k]=BASE.BOOL.has(k)?v==='on':v;render()}
});
shelfEl.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='lower'){S.lower=+t.value;render()}
 else if(t.id==='zekken-num'){S.number=Math.max(0,Math.min(99,parseInt(t.value,10)||0));S.zekken=true;render()}
 else if(t.type==='color'){S[t.dataset.k]=t.value;render()}
});
function switchBase(k){cur.base=k;BASE=BASES[k];S=cur[k];buildShelf();render()}

function render(){
 document.getElementById('bike').innerHTML=BASE.draw();
 updateUI();store(KEY_CUR,cur);
}
function updateUI(){
 document.querySelectorAll('.chip[data-k]').forEach(b=>{const k=b.dataset.k,v=b.dataset.v;
  b.setAttribute('aria-pressed',String(BASE.BOOL.has(k)?(v==='on')===S[k]:S[k]===v))});
 BASE.uiExtra(S);
 document.querySelectorAll('.sw').forEach(b=>b.setAttribute('aria-pressed',String(S[b.dataset.k]===b.dataset.v)));
 document.querySelectorAll('.custom input').forEach(i=>{if(/^#[0-9a-f]{6}$/i.test(S[i.dataset.k]))i.value=S[i.dataset.k]});
 const pi=BASE.PRESETS.findIndex(([,p])=>{const f={...BASE.DEFAULT,...p};return Object.keys(f).every(k=>f[k]===S[k])});
 document.querySelectorAll('[data-preset]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.preset===pi)));
 document.getElementById('lower').value=S.lower;document.getElementById('lower-out').textContent=`−${S.lower*2} mm`;
 document.getElementById('style-name').textContent=BASE.styleName(S);
 const {rows,colors,specs}=BASE.sheet(S);
 document.getElementById('sheet').innerHTML=[['ベース車両',BASE.label]].concat(rows).map(([a,b])=>`<div class="row"><span>${a}</span><span>${b}</span></div>`).join('')+
  colors.map(([a,b,c])=>`<div class="row"><span>${a}</span><span>${c?`<i class="dot" style="background:${c}"></i>`:''}${b}</span></div>`).join('');
 document.getElementById('specs').innerHTML=specs.map(([a,v])=>`<div class="spec"><small>${a}</small><b>${v}</b></div>`).join('')+`<span class="spec-note">数値は図面上の目安です</span>`;
 renderSaves();
}

/* saves */
const getSaves=()=>load(KEY_SAVES)||[];
function saveBuild(){const list=getSaves();const n=list.length?Math.max(...list.map(x=>x.n))+1:1;const d=new Date();
 list.unshift({n,base:cur.base,name:`ビルド #${n}`,date:`${d.getMonth()+1}/${d.getDate()}`,state:{...S}});store(KEY_SAVES,list.slice(0,20));renderSaves()}
function renderSaves(){
 const el=document.getElementById('saves');if(!el)return;const list=getSaves();
 if(!list.length){el.innerHTML=`<p class="empty">保存した仕様はまだありません。気に入った組み合わせを保存しておくと、あとで呼び出せます。</p>`;return}
 el.innerHTML=list.map((b,i)=>{const B=BASES[b.base||'ss'];return `<div class="save"><button type="button" class="load" data-load="${i}"><i class="dot" style="background:${b.state.main}"></i><span class="nm">${b.name}</span><span class="st">${B.label}・${B.styleName({...B.DEFAULT,...b.state})}・${b.date}</span></button><button type="button" class="del" data-del="${i}" aria-label="${b.name}を削除">×</button></div>`}).join('');
}
document.addEventListener('click',e=>{
 const l=e.target.closest('[data-load]');if(l){const b=getSaves()[+l.dataset.load];const k=b.base||'ss';
  cur[k]={...BASES[k].DEFAULT,...b.state};if(k!==cur.base)switchBase(k);else{S=cur[k];render()}return}
 const d=e.target.closest('[data-del]');if(d){const list=getSaves();list.splice(+d.dataset.del,1);store(KEY_SAVES,list);renderSaves()}
});

document.getElementById('bike').addEventListener('click',e=>{
 const g=e.target.closest('[data-part]');if(!g)return;
 const sec=document.getElementById(BASE.partMap[g.dataset.part]);if(!sec)return;
 const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const off=innerWidth<=900?document.querySelector('.stage').offsetHeight:0;
 window.scrollTo({top:sec.getBoundingClientRect().top+scrollY-off-16,behavior:reduce?'auto':'smooth'});
 sec.classList.add('flash');setTimeout(()=>sec.classList.remove('flash'),900);
});

document.getElementById('btn-reset').onclick=()=>{setState({...BASE.DEFAULT});render()};
document.getElementById('btn-random').onclick=()=>{
 const pick=a=>a[Math.floor(Math.random()*a.length)];
 for(const k of Object.keys(BASE.PARTS))S[k]=pick(BASE.PARTS[k][1])[0];
 for(const k of Object.keys(BASE.SW))S[k]=pick(BASE.SW[k])[0];
 BASE.randomExtra(S);S.lower=Math.floor(Math.random()*16);render();
};

buildShelf();render();
</script>
